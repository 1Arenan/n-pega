<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Corrida 3D - Supercarro Realista</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 12px #00f0ff, 2px 2px 6px #000;
            z-index: 10;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.95);
            padding: 40px 60px;
            border: 2px solid #ff0055;
            border-radius: 16px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.5);
            backdrop-filter: blur(8px);
        }
        #game-over h1 { color: #ff0055; margin-top: 0; font-size: 38px; text-shadow: 0 0 15px #ff0055; }
        #game-over p { font-size: 18px; color: #cccccc; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">⚡ PONTOS: <span id="score">0</span></div>
    
    <div id="game-over">
        <h1>BATIDA INEVITÁVEL! 💥</h1>
        <p>Seu veículo colidiu com um obstáculo na pista.</p>
        <p>Aperte <b>F5</b> para reiniciar a corrida.</p>
    </div>

    <script>
        // --- CENA & RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050512);
        scene.fog = new THREE.FogExp2(0x050512, 0.0075);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- ILUMINAÇÃO ---
        const ambientLight = new THREE.AmbientLight(0x7788aa, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
        dirLight.position.set(30, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- PISTA ---
        const roadWidth = 15;
        const roadLength = 300;

        const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x121218, roughness: 0.5, metalness: 0.2 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        // Faixas na pista
        const stripes = [];
        const stripeGeo = new THREE.PlaneGeometry(0.35, 4.5);
        const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        [-2.5, 2.5].forEach(laneX => {
            for (let z = -roadLength / 2; z < roadLength / 2; z += 10) {
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(laneX, 0.02, z);
                scene.add(stripe);
                stripes.push(stripe);
            }
        });

        // --- GERADOR DE RODA REALISTA ---
        function createDetailedWheel(radius, width) {
            const wheelGroup = new THREE.Group();

            // Pneu de Borracha com sulcos
            const tireMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.85, metalness: 0.1 });
            const tire = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width, 32), tireMat);
            tire.rotation.z = Math.PI / 2;
            tire.castShadow = true;
            wheelGroup.add(tire);

            // Aro Esportivo (Liga Leve)
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.9, roughness: 0.1 });
            const rimCenter = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.65, radius * 0.65, width + 0.01, 16), rimMat);
            rimCenter.rotation.z = Math.PI / 2;
            wheelGroup.add(rimCenter);

            // Raios do Aro
            const spokeMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
            for (let i = 0; i < 5; i++) {
                const spoke = new THREE.Mesh(new THREE.BoxGeometry(width + 0.02, radius * 1.1, radius * 0.12), spokeMat);
                spoke.rotation.x = (i * Math.PI) / 2.5;
                wheelGroup.add(spoke);
            }

            // Disco de Freio Ventilado
            const brakeMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.95, roughness: 0.2 });
            const brakeDisc = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.55, radius * 0.55, 0.04, 24), brakeMat);
            brakeDisc.rotation.z = Math.PI / 2;
            wheelGroup.add(brakeDisc);

            // Pinça de Freio Esportiva Vermelha
            const caliperMat = new THREE.MeshStandardMaterial({ color: 0xee0000, metalness: 0.4, roughness: 0.3 });
            const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.08, radius * 0.45, radius * 0.35), caliperMat);
            caliper.position.set(0, radius * 0.25, 0);
            wheelGroup.add(caliper);

            return wheelGroup;
        }

        // --- SUPERCARRO REALISTA DO JOGADOR ---
        function createUltraRealisticPlayerCar() {
            const carGroup = new THREE.Group();

            // Materiais PBR
            const paintMat = new THREE.MeshPhysicalMaterial({
                color: 0x00d8ff,
                metalness: 0.85,
                roughness: 0.12,
                clearcoat: 1.0,
                clearcoatRoughness: 0.03
            });
            const carbonMat = new THREE.MeshStandardMaterial({ color: 0x111114, roughness: 0.4, metalness: 0.8 });
            const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x030810, metalness: 0.9, roughness: 0.05, transparent: true, opacity: 0.88 });
            const chromeMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.95, roughness: 0.05 });

            // 1. Chassi/Base
            const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.25, 4.3), carbonMat);
            baseMesh.position.y = 0.25;
            carGroup.add(baseMesh);

            // 2. Corpos e Vincos Laterais (Aerodinâmica)
            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(2.05, 0.45, 4.0), paintMat);
            mainBody.position.set(0, 0.55, 0.1);
            carGroup.add(mainBody);

            const sideScoopL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.3, 1.2), carbonMat);
            sideScoopL.position.set(-1.02, 0.5, 0.2);
            const sideScoopR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.3, 1.2), carbonMat);
            sideScoopR.position.set(1.02, 0.5, 0.2);
            carGroup.add(sideScoopL, sideScoopR);

            // 3. Capô Inclinado e Grade Dianteira
            const hood = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.22, 1.4), paintMat);
            hood.position.set(0, 0.58, -1.25);
            hood.rotation.x = 0.12;
            carGroup.add(hood);

            const frontGrill = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.25, 0.1), carbonMat);
            frontGrill.position.set(0, 0.42, -1.91);
            carGroup.add(frontGrill);

            const splitter = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.06, 0.4), carbonMat);
            splitter.position.set(0, 0.22, -1.95);
            carGroup.add(splitter);

            // 4. Cabine e Para-brisa
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 2.0), glassMat);
            cabin.position.set(0, 0.98, -0.05);
            carGroup.add(cabin);

            const roof = new THREE.Mesh(new THREE.BoxGeometry(1.38, 0.06, 1.2), carbonMat);
            roof.position.set(0, 1.24, -0.05);
            carGroup.add(roof);

            // 5. Retrovisores Esportivos
            [-1.02, 1.02].forEach(x => {
                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.08), carbonMat);
                arm.position.set(x, 0.88, -0.6);
                
                const mirrorCap = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.14, 0.18), paintMat);
                mirrorCap.position.set(x > 0 ? x + 0.12 : x - 0.12, 0.9, -0.6);
                
                const mirrorGlass = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.11), chromeMat);
                mirrorGlass.rotation.y = x > 0 ? -Math.PI / 2 : Math.PI / 2;
                mirrorGlass.position.set(x > 0 ? x + 0.25 : x - 0.25, 0.9, -0.6);

                carGroup.add(arm, mirrorCap, mirrorGlass);
            });

            // 6. Aerofólio Traseiro e Difusor
            const wingSupportL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.35, 0.25), carbonMat);
            wingSupportL.position.set(-0.65, 0.95, 1.85);
            const wingSupportR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.35, 0.25), carbonMat);
            wingSupportR.position.set(0.65, 0.95, 1.85);

            const wingBlade = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.06, 0.45), carbonMat);
            wingBlade.position.set(0, 1.13, 1.88);
            wingBlade.rotation.x = -0.08;
            carGroup.add(wingSupportL, wingSupportR, wingBlade);

            const diffuser = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.2, 0.3), carbonMat);
            diffuser.position.set(0, 0.28, 2.0);
            carGroup.add(diffuser);

            // Escapamento Quadruplo
            [-0.5, -0.3, 0.3, 0.5].forEach(x => {
                const exhaust = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.3, 16), chromeMat);
                exhaust.rotation.x = Math.PI / 2;
                exhaust.position.set(x, 0.35, 2.05);
                carGroup.add(exhaust);
            });

            // 7. Sistema de Iluminação LED (Faróis / Lanternas)
            const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const headL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.08, 0.1), headlightMat);
            headL.position.set(-0.65, 0.6, -1.9);
            const headR = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.08, 0.1), headlightMat);
            headR.position.set(0.65, 0.6, -1.9);
            carGroup.add(headL, headR);

            const lightL = new THREE.PointLight(0x00f0ff, 2.5, 30);
            lightL.position.set(-0.65, 0.6, -2.1);
            const lightR = new THREE.PointLight(0x00f0ff, 2.5, 30);
            lightR.position.set(0.65, 0.6, -2.1);
            carGroup.add(lightL, lightR);

            const tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff0022 });
            const tailStrip = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.08, 0.08), tailLightMat);
            tailStrip.position.set(0, 0.68, 2.06);
            carGroup.add(tailStrip);

            // 8. Rodas Detalhadas
            [[-1.08, 0.38, 1.25], [1.08, 0.38, 1.25], [-1.08, 0.38, -1.25], [1.08, 0.38, -1.25]].forEach(pos => {
                const wheel = createDetailedWheel(0.38, 0.32);
                wheel.position.set(...pos);
                carGroup.add(wheel);
            });

            // Neon Underglow Azul Cyan
            const glow = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 4.4), new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.55 }));
            glow.rotation.x = -Math.PI / 2;
            glow.position.y = 0.06;
            carGroup.add(glow);

            return carGroup;
        }

        // --- OBSTÁCULOS DA PISTA ---
        function createObstacle() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0044, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.7, 4.0), mat);
            body.position.y = 0.6;
            group.add(body);
            group.userData = { hitWidth: 2.1, hitLength: 4.0 };
            return group;
        }

        // --- SETUP DA CENA ---
        const playerCar = createUltraRealisticPlayerCar();
        playerCar.position.set(0, 0, 10);
        scene.add(playerCar);

        camera.position.set(0, 3.8, 16.5);
        camera.lookAt(playerCar.position.x, 0.8, playerCar.position.z - 10);

        // Controles
        const keys = { left: false, right: false };
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        // Loop de Animação
        let obstacles = [];
        let score = 0;
        let speed = 0.9;
        let isGameOver = false;
        let frameCounter = 0;

        function spawnObstacle() {
            const obstacle = createObstacle();
            const lanes = [-4.5, -1.5, 1.5, 4.5];
            obstacle.position.set(lanes[Math.floor(Math.random() * lanes.length)], 0, -120);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // Controles com Rolagem Suave do Chassi
            const steerSpeed = 0.26;
            const maxBound = (roadWidth / 2) - 1.5;

            if (keys.left && playerCar.position.x > -maxBound) {
                playerCar.position.x -= steerSpeed;
                playerCar.rotation.z = 0.12;
                playerCar.rotation.y = 0.04;
            } else if (keys.right && playerCar.position.x < maxBound) {
                playerCar.position.x += steerSpeed;
                playerCar.rotation.z = -0.12;
                playerCar.rotation.y = -0.04;
            } else {
                playerCar.rotation.z = 0;
                playerCar.rotation.y = 0;
            }

            // Movimento da Pista
            stripes.forEach(s => { s.position.z += speed; if (s.position.z > 30) s.position.z -= roadLength; });

            // Inimigos
            frameCounter++;
            if (frameCounter % Math.max(22, Math.floor(60 - score / 150)) === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed;

                const hitW = (obs.userData.hitWidth / 2) + 0.9;
                const hitL = (obs.userData.hitLength / 2) + 1.6;

                if (Math.abs(playerCar.position.x - obs.position.x) < hitW &&
                    Math.abs(playerCar.position.z - obs.position.z) < hitL) {
                    isGameOver = true;
                    document.getElementById('game-over').style.display = 'block';
                }

                if (obs.position.z > 25) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            score += 1;
            speed += 0.0002;
            document.getElementById('score').innerText = Math.floor(score / 10);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
